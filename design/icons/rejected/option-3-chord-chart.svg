<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c20"/>
      <stop offset="1" stop-color="#070707"/>
    </linearGradient>
    <radialGradient id="dot" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset="0.35" stop-color="#ffb02e"/>
      <stop offset="1" stop-color="#d0350f"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- G chord: strings vertical (low E left), nut at top -->
  <rect x="126" y="112" width="260" height="16" rx="4" fill="#efe9da"/>
  <g stroke="#b9b9c2" stroke-width="5">
    <line x1="126" y1="196" x2="386" y2="196"/><line x1="126" y1="268" x2="386" y2="268"/>
    <line x1="126" y1="340" x2="386" y2="340"/><line x1="126" y1="412" x2="386" y2="412"/>
  </g>
  <g stroke="#e6e6ea">
    <line x1="130" y1="120" x2="130" y2="412" stroke-width="7"/><line x1="181" y1="120" x2="181" y2="412" stroke-width="6"/>
    <line x1="232" y1="120" x2="232" y2="412" stroke-width="5"/><line x1="283" y1="120" x2="283" y2="412" stroke-width="4"/>
    <line x1="334" y1="120" x2="334" y2="412" stroke-width="3.5"/><line x1="382" y1="120" x2="382" y2="412" stroke-width="3"/>
  </g>
  <g filter="url(#glow)" stroke="#1a0700" stroke-width="4">
    <circle cx="130" cy="304" r="26" fill="url(#dot)"/>
    <circle cx="181" cy="232" r="26" fill="url(#dot)"/>
    <circle cx="382" cy="304" r="26" fill="url(#dot)"/>
  </g>
  <g fill="none" stroke="#7dff6a" stroke-width="5">
    <circle cx="232" cy="84" r="12"/><circle cx="283" cy="84" r="12"/><circle cx="334" cy="84" r="12"/>
  </g>
</svg>
