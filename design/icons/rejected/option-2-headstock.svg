    <line x1="362" y1="150" x2="298" y2="150"/><line x1="366" y1="236" x2="304" y2="236"/><line x1="362" y1="322" x2="298" y2="322"/>
  </g>
  <!-- strings from the nut to the posts -->
  <g stroke="#e6e6ea" stroke-width="2.5">
    <line x1="221" y1="384" x2="214" y2="322"/><line x1="235" y1="384" x2="208" y2="236"/><line x1="249" y1="384" x2="214" y2="150"/>
    <line x1="263" y1="384" x2="298" y2="150"/><line x1="277" y1="384" x2="304" y2="236"/><line x1="291" y1="384" x2="298" y2="322"/>
