<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <pattern id="tolex" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#121214"/>
      <circle cx="2" cy="2" r="1.2" fill="#1e1e22"/><circle cx="6" cy="6" r="1.2" fill="#1a1a1d"/>
    </pattern>
    <radialGradient id="knob" cx="42%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#cfcfd6"/>
      <stop offset="0.8" stop-color="#6a6a72"/>
      <stop offset="1" stop-color="#3a3a40"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#tolex)"/>
  <!-- glowing level arc from the 7 o'clock position around to the top-right ("11") -->
  <path d="M138 374 A168 168 0 1 1 410 220" fill="none" stroke="#ff7a18" stroke-width="20" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M410 220 A168 168 0 0 1 374 374" fill="none" stroke="#2c2c32" stroke-width="20" stroke-linecap="round"/>
  <g stroke="#9a9aa4" stroke-width="6" stroke-linecap="round">
    <line x1="98" y1="414" x2="114" y2="398"/><line x1="64" y1="256" x2="86" y2="256"/><line x1="114" y1="114" x2="130" y2="130"/>
    <line x1="256" y1="64" x2="256" y2="86"/><line x1="398" y1="114" x2="382" y2="130"/><line x1="448" y1="256" x2="426" y2="256"/>
    <line x1="414" y1="414" x2="398" y2="398"/>
  </g>
  <circle cx="256" cy="256" r="122" fill="#0a0a0c"/>
  <circle cx="256" cy="256" r="110" fill="url(#knob)" stroke="#111" stroke-width="5"/>
  <circle cx="256" cy="256" r="74" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3"/>
  <line x1="256" y1="256" x2="330" y2="190" stroke="#ff7a18" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
</svg>
