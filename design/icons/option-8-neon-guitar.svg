<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0" stop-color="#1b1446"/>
      <stop offset="1" stop-color="#07061a"/>
    </radialGradient>
    <filter id="neon" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <feGaussianBlur stdDeviation="9" result="wide"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="tight"/>
      <feMerge><feMergeNode in="wide"/><feMergeNode in="tight"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="rotate(-32 256 256) translate(0 18)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- neck and headstock: cyan tube -->
    <g filter="url(#neon)" stroke="#3ff0ff" stroke-width="9">
      <path d="M244 172 L244 78 M268 172 L268 78"/>
      <rect x="230" y="34" width="52" height="44" rx="12"/>
    </g>
    <!-- body: pink tube -->
    <g filter="url(#neon)" stroke="#ff3fa4" stroke-width="10">
      <path d="M256 172 C216 172 190 196 190 230 C190 254 203 268 199 284 C195 300 164 310 164 352 C164 410 206 446 256 446 C306 446 348 410 348 352 C348 310 317 300 313 284 C309 268 322 254 322 230 C322 196 296 172 256 172 Z"/>
      <circle cx="256" cy="296" r="30"/>
      <path d="M226 392 L286 392"/>
    </g>
    <!-- white-hot cores -->
    <g stroke="#ffffff" stroke-width="3" opacity="0.9">
      <path d="M244 172 L244 78 M268 172 L268 78"/>
      <rect x="230" y="34" width="52" height="44" rx="12"/>
      <path d="M256 172 C216 172 190 196 190 230 C190 254 203 268 199 284 C195 300 164 310 164 352 C164 410 206 446 256 446 C306 446 348 410 348 352 C348 310 317 300 313 284 C309 268 322 254 322 230 C322 196 296 172 256 172 Z"/>
      <circle cx="256" cy="296" r="30"/>
    </g>
  </g>
</svg>
